name: Blacksmith CI + Cosign

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v7

      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: etherhive-linux-amd64
          path: target/release/etherhive

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: etherhive-linux-amd64

      - uses: sigstore/cosign-installer@v3

      - name: Cosign sign binary
        run: |
          cosign sign-blob --yes \
            --output-signature etherhive.sig \
            --output-certificate etherhive.pem \
            etherhive

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            etherhive
            etherhive.sig
            etherhive.pem
          generate_release_notes: true
          body: |
            ## Genesis
            vaked-base genesis seal: 7c242080f5f821e5eaf563fe2208d60632c451687baf65f4fe8e4a0d226e3ecf
            
            Signed by [The Architect of Structural Honesty]
            2026-07-28, full moon, 10,000X
