[package]
name = "etherhive"
version = "2.1.0"
edition = "2021"
description = "Quantum-proof decentralized messaging. Auth via honesty. Mesh via Tailnet. Crypto via Kyber + Dilithium. One name, no phone number."

[[bin]]
name = "etherhive"
path = "src/main.rs"

[[bin]]
name = "etherhive-vpn"
path = "src/bin/vpn.rs"

[[bin]]
name = "etherhive-crypt"
path = "src/bin/crypt.rs"

[[bin]]
name = "etherhive-mesh"
path = "src/bin/mesh.rs"

[[bin]]
name = "etherhive-ircd"
path = "src/bin/ircd.rs"

[[bin]]
name = "etherhive-client"
path = "src/bin/client.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"
libc = "0.2"
subtle = "2"
regex-lite = "0.1"

# WebSocket for IRC-like protocol
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# PQC algorithms — RustCrypto, NIST FIPS 203/204/205 final standards
ml-kem = { version = "0.3.2", features = ["getrandom"] } # FIPS 203 — ML-KEM-1024 (CRYSTALS-Kyber)
ml-dsa = "0.1.1"    # FIPS 204 — ML-DSA-87 (CRYSTALS-Dilithium)
slh-dsa = "0.1.0"   # FIPS 205 — SLH-DSA-SHA2-128s (SPHINCS+)
# slh-dsa 0.1.0 only compiles against signature 2.3.0-pre.4 exactly (newer
# pre-releases renamed CryptoRngCore); pin the transitive dep to unbreak it.
signature = "=2.3.0-pre.4"

# Note: transport layer is classical X25519 + ChaCha20Poly1305 (crypto.rs).
# Hybrid mode (ML-KEM + X25519) lands in phase 2 (X3DH/PQXDH-style bootstrap).
