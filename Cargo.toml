[package]
name = "etherhive"
version = "2.1.0"
edition = "2021"
description = "Quantum-proof decentralized messaging. Auth via honesty. Mesh via Tailnet. Crypto via Kyber + Dilithium. One name, no phone number."

[[bin]]
name = "etherhive"
path = "src/main.rs"

[[bin]]
name = "etherhive-vpn"
path = "src/bin/vpn.rs"

[[bin]]
name = "etherhive-crypt"
path = "src/bin/crypt.rs"

[[bin]]
name = "etherhive-mesh"
path = "src/bin/mesh.rs"

[[bin]]
name = "etherhive-ircd"
path = "src/bin/ircd.rs"

[[bin]]
name = "etherhive-client"
path = "src/bin/client.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"
libc = "0.2"
subtle = "2"
regex-lite = "0.1"
thiserror = "1"

# WebSocket for IRC-like protocol
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# PQC algorithms — RustCrypto, NIST FIPS 203/204/205 final standards
ml-kem = { version = "0.3.2", features = ["getrandom"] } # FIPS 203 — ML-KEM-1024 (CRYSTALS-Kyber)
ml-dsa = "0.1.1"    # FIPS 204 — ML-DSA-87 (CRYSTALS-Dilithium)
# 0.2.0-rc.5, not the stable 0.1.0: 0.1.0 only compiles against signature
# 2.3.0-pre.4 exactly, which collides with ed25519-dalek's stable
# signature >=2.0,<2.3 requirement (needed by vodozemac, below) — no single
# `signature` version can satisfy both. 0.2.0-rc.5 moved to signature 3.x,
# the same major line ml-dsa already uses, freeing the 2.x line for
# ed25519-dalek. API is unchanged for the calls pqc.rs makes.
slh-dsa = "0.2.0-rc.5"   # FIPS 205 — SLH-DSA-SHA2-128s (SPHINCS+)
# slh-dsa 0.2.0-rc.5's RandomizedSigner needs a rand_core 0.10 CryptoRng —
# a different generation than rand 0.8's ThreadRng (rand_core 0.6-based).
# Renamed so it doesn't collide with the `rand = "0.8"` used everywhere
# else in this crate; used only for this one call site.
rand10 = { package = "rand", version = "0.10" }

# Real X3DH-style bootstrap + Double Ratchet (Matrix's Olm, audited-quality,
# actively maintained) — not hand-rolled. Phase 2's hybrid PQ layer wraps
# this with an ML-KEM-derived outer encryption (see src/ratchet.rs).
vodozemac = "0.10"

# Note: transport layer (crypto.rs CryptoSession) is classical X25519 +
# ChaCha20Poly1305, used for the client<->server hop (phase 0). The 1:1
# ratchet (src/ratchet.rs) is the real peer<->peer E2E layer (phase 2).
